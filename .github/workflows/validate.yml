name: Validate recipes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate recipes against schema
        run: node scripts/validate.js
      - name: Check config cards match working recipes
        run: python3 tools/render_card.py --check
